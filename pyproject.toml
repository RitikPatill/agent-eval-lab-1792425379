[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-eval-lab"
version = "0.1.0"
description = "Self-hosted, UI-first evaluation harness for AI agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "sqlmodel>=0.0.21",
    "pyyaml>=6.0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "typer>=0.13",
    "anthropic>=0.40",
    "jsonschema>=4.23",
    "streamlit>=1.40",
    "plotly>=5.24",
    "pandas>=2.2",
]

[project.scripts]
agent-eval = "agent_eval_lab.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.12",
    "pre-commit>=4.0",
    "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_eval_lab"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
